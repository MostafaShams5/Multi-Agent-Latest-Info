services:
  api:
    build: .
    container_name: telegram_ai_bot
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override config.py defaults to use the Docker network hostnames
      - QDRANT_URL=http://qdrant:6333
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - qdrant
      - redis
    volumes:
      # Mount the token.json so Gmail Auth persists inside the container
      - ./token.json:/app/token.json

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_db
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_data:/qdrant/storage

  redis:
    image: redis:alpine
    container_name: redis_queue
    restart: unless-stopped
    volumes:
      - ./redis_data:/data
